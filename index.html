<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Birthday Wincy</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="overlay"></div>

<div class="stars"></div>

<div class="container">

<!-- =========================
PAGE 1
========================= -->

<section id="page1" class="page active">

<div class="card">

<div class="ornament">✦ ❀ ✦</div>

<h2 class="title">
Happy Birthday,
</h2>

<h1 class="name">
Wincy!
</h1>

<p class="wish">

Wishing you a year full of positive energy ahead!

<br><br>

Go shine ✨

</p>

<button id="continueBtn">

Continue →

</button>

</div>

</section>

<!-- =========================
PAGE 2
========================= -->

<section id="page2" class="page">

<div class="card">

<h2 class="heading">

A tiny challenge...

</h2>

<p class="question">

Which Disney princess do these emojis represent?

</p>

<div class="emoji">

🏰 🧞‍♂️ 🐅 ✨

</div>

<input

type="text"

id="answer"

placeholder="Type your answer">

<button id="checkBtn">

Check

</button>

<p id="error"></p>

</div>

</section>

<!-- =========================
PAGE 3
========================= -->

<section id="page3" class="page">

<div class="card">

<h2 id="welcome">

✨ Welcome, Princess of Agrabah. ✨

</h2>

<div id="decrypt">

<p>Decrypting surprise...</p>

<div class="bar">

<div class="fill"></div>

</div>

</div>

<button id="surpriseBtn">

🎁 Open Surprise

</button>

</div>

</section>

</div>

<script src="script.js"></script>

</body>

</html>
